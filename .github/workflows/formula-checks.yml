name: Formula checks

on:
  pull_request:
    paths:
      - "Formula/**"
      - ".github/workflows/formula-checks.yml"
  push:
    branches: [master]
    paths:
      - "Formula/**"
      - ".github/workflows/formula-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04
        id: homebrew
      - name: Style and audit
        env:
          TAP: ${{ steps.homebrew.outputs.tap-name }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew style "$TAP"
          brew audit --strict "$TAP/cryptomator-cli"
      - name: Install and test
        env:
          TAP: ${{ steps.homebrew.outputs.tap-name }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          brew install --build-from-source "$TAP/cryptomator-cli"
          brew test "$TAP/cryptomator-cli"
